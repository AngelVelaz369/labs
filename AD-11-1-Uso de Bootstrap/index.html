<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Laboratorio Bootstrap - AD-11</title>
  <link href="style.css" rel="stylesheet" type="text/css" />

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>

<body>
  <div class="container-fluid">

    <h1 class="mb-4">Laboratorio: Uso de bootstrap</h1>

    <section class="mb-5">
      <h2>Botones de diferentes colores</h2>
      <button type="button" class="btn btn-primary">Primario</button>
      <button type="button" class="btn btn-success">Éxito</button>
      <button type="button" class="btn btn-danger">Peligro</button>
    </section>

    <section class="mb-5">
      <h2>Alineación de Texto</h2>
      <p class="text-start">Izquierda</p>
      <p class="text-center text-danger">Centro</p>
      <p class="text-end">Derecha</p>
    </section>

    <section class="mb-5">
      <h2>Targeta con Grupo de Listas</h2>

      <div class="card" style="width: 18rem;">

        <div class="card-header">Hoja de ruta</div>

        <img src="https://images.unsplash.com/photo-1610832958506-aa56368176cf?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.0.3" class="card-img-top" alt="Cesta de fruta">

        <div class="card-body">
          <p class="card-text">Frutas disponibles en la cesta:</p>
        </div>

        <ul class="list-group list-group-flush">
          <li class="list-group-item">Manzana</li>
          <li class="list-group-item">Plátano</li>
          <li class="list-group-item">Naranja</li>
        </ul>

      </div>
    </section>

  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

  <script src="script.js"></script>

  <!--
  This script places a badge on your repl's full-browser view back to your repl's cover
  page. Try various colors for the theme: dark, light, red, orange, yellow, lime, green,
  teal, blue, blurple, magenta, pink!
  -->
  <script src="https://replit.com/public/js/replit-badge-v2.js" theme="dark" position="bottom-right"></script>
</body>

</html>
