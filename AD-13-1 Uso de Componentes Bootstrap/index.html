<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Laboratorio AD-13 - Inicio</title>
  <link href="style.css" rel="stylesheet" type="text/css" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
</head>

<body>

  <!-- Barra de navegación-->
  <nav class="navbar navbar-expand-lg bg-body-tertiary mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Mi Sitio</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="index.html">Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="index2.html">Index2</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!--Botón Alerta-->
  <div class="container">
    <h1 class="mb-4">Bienvenido al Laboratorio de Bootstrap</h1>

    <section class="mb-5">
      <h3>Alerta Dinámica</h3>
      <button id="btnAlerta" class="btn btn-primary mb-3">El botón</button>

      <div id="alertaDinamica" class="alert alert-warning alert-dismissible fade show d-done" role="alert">
        Alerta, alguien presionó el botón 
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close" onclick="ocultarAlerta()"></button>
      </div>
    </section>

    <hr>

    <!--Rejilla (Grid)-->
    <section class="mb-5">
      <h3>Diseño de Grid</h3>

      <div class="row text-conter mb-3">
        <div class="col-md-2 bg-light border p-3">
          Lado izquierdo
        </div>
        <div class="col-md-8 bg-secondary text-white border p-3">
          Lado central
        </div>
        <div class="col-md-2 bg-light border p-3">
          Lado derecho
        </div>
      </div>

      <!--Pie de página-->
      <div class="row">
        <div class="col-12 bg-dark text-white text-center p-3">
          Pie de página
        </div>
      </div>
    </section>

    <hr>

    <!--Formulario-->

    <section class="mb-5">
      <h3>Formulario de Contacto</h3>
      <form>
        <div class="mb-3">
          <label for="correoInput" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="correoInput" placeholder="nombre@ejemplo.com">
        </div>

        <div class="mb-3">
          <label for="mensajeTextarea" class="form-label">Deja tu mensaje</label>
          <textarea class="form-control" id="mensajeTextarea" rows="3"></textarea>
        </div>

        <button type="submit" class="btn btn-success">Enviar</button>
      </form>
    </section>
  </div>

  <!--Script de Bootstrap-->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm" crossorigin="anonymous"></script>

  <script src="script.js"></script>

  <!--
  This script places a badge on your repl's full-browser view back to your repl's cover
  page. Try various colors for the theme: dark, light, red, orange, yellow, lime, green,
  teal, blue, blurple, magenta, pink!
  -->
  <script src="https://replit.com/public/js/replit-badge-v2.js" theme="dark" position="bottom-right"></script>
</body>

</html>
